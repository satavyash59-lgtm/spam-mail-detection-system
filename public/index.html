<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phishing & Spam Sentinel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans flex flex-col justify-between">
  <div class="max-w-4xl mx-auto w-full">
    <div class="border-b border-slate-800 pb-4 mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-cyan-400">Phishing & Spam Sentinel</h1>
        <p class="text-xs text-slate-400">NLP & Threat Heuristics Classification Engine</p>
      </div>
      <span class="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800 px-3 py-1 rounded font-mono">LIVE LOCALHOST:8000</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2 space-y-4">
        <textarea id="payload" rows="6" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500 font-mono" placeholder="Enter email or SMS text to scan..."></textarea>
        
        <div class="flex gap-2 text-xs">
          <button id="p1" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded">Preset: Bank Phish</button>
          <button id="p2" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded">Preset: Gift Spam</button>
          <button id="p3" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded">Preset: Safe Note</button>
        </div>

        <button id="scanBtn" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 font-semibold rounded text-white transition">Analyze Payload</button>

        <div class="grid grid-cols-3 gap-2 text-xs font-mono bg-slate-900 border border-slate-800 p-3 rounded">
          <div>URLs: <b id="u" class="text-cyan-400">0</b></div>
          <div>Keywords: <b id="k" class="text-cyan-400">0</b></div>
          <div>Exclamations: <b id="e" class="text-cyan-400">0</b></div>
          <div>Uppercase: <b id="up" class="text-cyan-400">0%</b></div>
          <div class="col-span-2">Length: <b id="l" class="text-cyan-400">0 chars</b></div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-lg text-center flex flex-col justify-center items-center">
        <div class="text-xs uppercase text-slate-500 font-mono mb-2">Threat Risk Score</div>
        <div id="score" class="text-5xl font-black font-mono text-slate-600 mb-2">0%</div>
        <div id="badge" class="px-3 py-1 rounded text-xs font-mono bg-slate-800 text-slate-400 mb-3">IDLE</div>
        <div id="info" class="text-xs text-slate-400">Ready to analyze input text.</div>
      </div>
    </div>
  </div>

  <footer class="text-center text-xs text-slate-600 font-mono mt-8">Phishing Sentinel Engine &bull; FastAPI + Scikit-Learn</footer>

  <script>
    const samples = {
      p1: 'URGENT: Your bank account has been locked. Verify identity at https://secure-login.com to avoid suspension immediately!',
      p2: 'CONGRATULATIONS! You won a $1000 Amazon card! Text CLAIM to 8088 now to receive your reward!',
      p3: 'Hey, are we still meeting at the library at 3 PM today to review the project commit?'
    };

    document.getElementById('p1').onclick = () => document.getElementById('payload').value = samples.p1;
    document.getElementById('p2').onclick = () => document.getElementById('payload').value = samples.p2;
    document.getElementById('p3').onclick = () => document.getElementById('payload').value = samples.p3;

    document.getElementById('scanBtn').onclick = async () => {
      const val = document.getElementById('payload').value.trim();
      if (!val) return alert('Please enter some text first.');
      
      const btn = document.getElementById('scanBtn');
      btn.innerText = 'Analyzing...';
      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: val })
        });
        const d = await res.json();
        document.getElementById('u').innerText = d.signals.urls_detected;
        document.getElementById('k').innerText = d.signals.urgent_keywords;
        document.getElementById('e').innerText = d.signals.exclamations;
        document.getElementById('up').innerText = d.signals.uppercase_pct + '%';
        document.getElementById('l').innerText = d.signals.char_length + ' chars';

        const sc = d.threat_score;
        const el = document.getElementById('score');
        const bg = document.getElementById('badge');
        el.innerText = sc + '%';

        if (sc >= 50) {
          el.className = 'text-5xl font-black font-mono text-red-500 mb-2';
          bg.className = 'px-3 py-1 rounded text-xs font-mono bg-red-950 text-red-400 border border-red-700 mb-3';
          bg.innerText = d.threat_type;
          document.getElementById('info').innerText = 'Warning: Malicious social engineering or link redirect detected.';
        } else {
          el.className = 'text-5xl font-black font-mono text-emerald-400 mb-2';
          bg.className = 'px-3 py-1 rounded text-xs font-mono bg-emerald-950 text-emerald-400 border border-emerald-700 mb-3';
          bg.innerText = 'SAFE (HAM)';
          document.getElementById('info').innerText = 'Payload appears legitimate with normal linguistic structure.';
        }
      } catch (err) {
        alert('Could not reach FastAPI backend. Make sure uvicorn is running.');
      } finally {
        btn.innerText = 'Analyze Payload';
      }
    };
  </script>
</body>
</html>
